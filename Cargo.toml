[package]
name = "schiffe_versenken"
version = "0.1.0"
edition = "2024"

[dependencies]
arrayvec = { version = "0.7.6", default-features = false }
colored = { version = "3.0.0", default-features = false }
colorgrad = { version = "0.7.1", default-features = false, features = [
    "preset",
] }
glam = { version = "0.30.0", default-features = false, features = ["std"] }
num-format = { version = "0.4.4", default-features = false, features = ["std"] }

rayon = { version = "1.10.0", default-features = false }


[profile.release]
# opt-level = 3
# incremental = true
# lto = "fat"

# opt-level = 3
# lto = "fat"
# codegen-units = 1
# panic = "abort"
# strip = true
debug = 2


# inherits = true
# debug-assertions = true
# overflow-checks = true
# split-debuginfo = "unpacked"
# debug = 0

# [profile.release.build-override]
# opt-level = 3
